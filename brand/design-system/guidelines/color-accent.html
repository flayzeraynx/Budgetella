<!-- @dsCard group="Colors" viewport="700x150" name="Accent" subtitle="Violet — the single brand accent (mode-independent)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);color:var(--text-primary);padding:20px;display:flex;gap:16px}
  .sw{flex:1;border-radius:var(--radius-medium);border:var(--glass-border);overflow:hidden}
  .chip{height:64px}
  .meta{padding:10px 12px;background:var(--surface)}
  .n{font-size:13px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:12px;color:var(--text-tertiary);margin-top:2px}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:#6E5BFF"></div><div class="meta"><div class="n">Primary</div><div class="h">#6E5BFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#8B6FFF"></div><div class="meta"><div class="n">Primary Light</div><div class="h">#8B6FFF</div></div></div>
  <div class="sw"><div class="chip" style="background:linear-gradient(135deg,#9585FF,#6E5BFF)"></div><div class="meta"><div class="n">Logo gradient</div><div class="h">#9585FF → #6E5BFF</div></div></div>
</body></html>
