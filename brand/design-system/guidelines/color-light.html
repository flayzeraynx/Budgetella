<!-- @dsCard group="Colors" viewport="700x170" name="Light surfaces" subtitle="Light theme — resolved at runtime alongside dark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:#F5F6FE;font-family:var(--font-brand);color:#1A1B2E;padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:var(--radius-small);border:1px solid rgba(0,0,0,.1);overflow:hidden}
  .chip{height:56px}
  .meta{padding:8px 10px;background:#fff}
  .n{font-size:12px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:11px;color:rgba(26,27,46,.5);margin-top:2px}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:#F5F6FE"></div><div class="meta"><div class="n">bg</div><div class="h">#F5F6FE</div></div></div>
  <div class="sw"><div class="chip" style="background:#ECEEF9"></div><div class="meta"><div class="n">bg-2</div><div class="h">#ECEEF9</div></div></div>
  <div class="sw"><div class="chip" style="background:#E4E5F4"></div><div class="meta"><div class="n">bg-3</div><div class="h">#E4E5F4</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="n">surface</div><div class="h">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#F0F1FA"></div><div class="meta"><div class="n">elevated</div><div class="h">#F0F1FA</div></div></div>
</body></html>
