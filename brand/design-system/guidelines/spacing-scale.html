<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid — xs → xxxl" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);color:var(--text-primary);padding:24px;display:flex;align-items:flex-end;gap:20px}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--accent-primary);border-radius:3px;width:100%}
  .box{width:48px;display:flex;justify-content:center}
  .n{font-size:12px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
</style></head>
<body>
  <div class="col"><div class="box"><div class="bar" style="height:4px"></div></div><div class="n">xs</div><div class="h">4</div></div>
  <div class="col"><div class="box"><div class="bar" style="height:8px"></div></div><div class="n">sm</div><div class="h">8</div></div>
  <div class="col"><div class="box"><div class="bar" style="height:12px"></div></div><div class="n">md</div><div class="h">12</div></div>
  <div class="col"><div class="box"><div class="bar" style="height:16px"></div></div><div class="n">lg</div><div class="h">16</div></div>
  <div class="col"><div class="box"><div class="bar" style="height:24px"></div></div><div class="n">xl</div><div class="h">24</div></div>
  <div class="col"><div class="box"><div class="bar" style="height:32px"></div></div><div class="n">xxl</div><div class="h">32</div></div>
  <div class="col"><div class="box"><div class="bar" style="height:48px"></div></div><div class="n">xxxl</div><div class="h">48</div></div>
</body></html>
