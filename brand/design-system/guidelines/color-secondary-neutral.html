<!-- @dsCard group="Colors" viewport="700x160" name="Secondary & neutral" subtitle="Cyan secondary accent + the navy neutral ladder" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);color:var(--text-primary);padding:24px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:10px}
  .sw{flex:1;height:52px;border-radius:10px;border:var(--glass-border);display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
  .k{font-size:10px;font-weight:700}
  .h{font-family:var(--font-mono);font-size:9px}
  .cap{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-tertiary)}
</style></head>
<body>
  <div>
    <div class="cap" style="margin-bottom:8px">Secondary accent — cyan (non-financial highlights)</div>
    <div class="row">
      <div class="sw" style="background:#38D6EE;color:#04323b"><div><span class="k">light</span> <span class="h">#38D6EE</span></div></div>
      <div class="sw" style="background:#06B6D4;color:#fff"><div><span class="k">base</span> <span class="h">#06B6D4</span></div></div>
      <div class="sw" style="background:#0E7C90;color:#fff"><div><span class="k">deep</span> <span class="h">#0E7C90</span></div></div>
    </div>
  </div>
  <div>
    <div class="cap" style="margin-bottom:8px">Neutral ladder — navy surfaces (dark theme)</div>
    <div class="row">
      <div class="sw" style="background:#0A0B14;color:#fff"><div><span class="k">bg</span> <span class="h">#0A0B14</span></div></div>
      <div class="sw" style="background:#11141C;color:#fff"><div><span class="k">surface</span> <span class="h">#11141C</span></div></div>
      <div class="sw" style="background:#14152A;color:#fff"><div><span class="k">bg-2</span> <span class="h">#14152A</span></div></div>
      <div class="sw" style="background:#1A1F2E;color:#fff"><div><span class="k">elevated</span> <span class="h">#1A1F2E</span></div></div>
      <div class="sw" style="background:#1A1740;color:#fff"><div><span class="k">bg-3</span> <span class="h">#1A1740</span></div></div>
    </div>
  </div>
</body></html>
