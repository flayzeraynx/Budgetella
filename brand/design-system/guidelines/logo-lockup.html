<!-- @dsCard group="Logo" viewport="700x210" name="Wordmark & lockup" subtitle="Mark + “Budgetella.” — horizontal and stacked" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);color:var(--text-primary);padding:28px;
    display:flex;align-items:center;gap:56px}
  img{border-radius:22%}
  .word{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:-.5px;color:var(--text-primary)}
  .h{display:flex;align-items:center;gap:16px}
  .v{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cap{margin-top:auto;font-size:12px;color:var(--text-tertiary)}
</style></head>
<body>
  <div class="h">
    <img src="../assets/AppIcon-1024.png" width="64" height="64" alt="Budgetella">
    <span class="word" style="font-size:38px">Budgetella<span style="color:var(--accent-primary-light)">.</span></span>
  </div>
  <div class="v">
    <img src="../assets/AppIcon-1024.png" width="72" height="72" alt="Budgetella">
    <span class="word" style="font-size:26px">Budgetella<span style="color:var(--accent-primary-light)">.</span></span>
  </div>
  <div style="align-self:flex-end;font-size:12px;color:var(--text-tertiary);max-width:150px;line-height:1.5">
    Wordmark set in Inter Bold, −0.5 tracking. The trailing period is optional and may take the accent color.
  </div>
</body></html>
