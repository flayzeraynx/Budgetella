<!-- @dsCard group="Logo" viewport="700x200" name="Primary mark" subtitle="Violet gradient + white B + mint dot — defined in code" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);color:var(--text-primary);padding:24px;display:flex;align-items:center;gap:28px}
  img{border-radius:calc(var(--logo-radius-ratio)*1em)}
  .specs{font-size:13px;color:var(--text-secondary);line-height:1.7}
  .specs b{color:var(--text-primary);font-weight:600}
  .mono{font-family:var(--font-mono);color:var(--text-tertiary)}
</style></head>
<body>
  <img src="../assets/AppIcon-1024.png" width="112" height="112" alt="Budgetella app icon">
  <img src="../assets/AppIcon-1024.png" width="64" height="64" alt="Budgetella app icon small">
  <div class="specs">
    <div><b>Rounded square</b> · violet gradient <span class="mono">#9585FF → #6E5BFF</span></div>
    <div><b>White bold "B"</b> · letter = size × 0.58</div>
    <div><b>Mint dot</b> <span class="mono">#10F2A5</span> · size × 0.155, offset +0.17 / −0.28</div>
    <div>Corner radius = size × <b>0.22</b></div>
  </div>
</body></html>
