<!-- @dsCard group="Colors" viewport="700x170" name="Web palette (divergent)" subtitle="Marketing site values — differ slightly from the app" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:#06070F;font-family:var(--font-brand);color:#fff;padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{border-radius:var(--radius-small);border:var(--glass-border);overflow:hidden}
  .chip{height:52px}
  .meta{padding:8px 10px;background:#14152A}
  .n{font-size:12px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:#886FFF"></div><div class="meta"><div class="n">accent</div><div class="h">#886FFF · app #8B6FFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#18F2A5"></div><div class="meta"><div class="n">income</div><div class="h">#18F2A5 · app #10F2A5</div></div></div>
  <div class="sw"><div class="chip" style="background:#F43F5E"></div><div class="meta"><div class="n">expense</div><div class="h">#F43F5E · app #FB7185</div></div></div>
  <div class="sw"><div class="chip" style="background:#E0B84A"></div><div class="meta"><div class="n">gold</div><div class="h">#E0B84A · web only</div></div></div>
</body></html>
