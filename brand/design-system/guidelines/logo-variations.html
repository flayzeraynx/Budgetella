<!-- @dsCard group="Logo" viewport="700x220" name="Variations" subtitle="Full-color is primary. Reversed / mono / line are constrained-use only." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);color:var(--text-primary);padding:24px;
    display:flex;gap:18px;align-items:flex-start}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .tile{width:100%;height:120px;border-radius:var(--radius-medium);display:flex;align-items:center;justify-content:center;border:var(--glass-border)}
  .blogo{--s:76px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.22);position:relative;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .blogo .b{font:700 calc(var(--s)*.56)/1 'Inter',sans-serif}
  .blogo .dot{position:absolute;width:calc(var(--s)*.15);height:calc(var(--s)*.15);border-radius:50%;top:calc(var(--s)*.15);right:calc(var(--s)*.17)}
  .name{font-size:13px;font-weight:600}
  .use{font-size:11px;color:var(--text-tertiary);line-height:1.4}
</style></head>
<body>
  <div class="col">
    <div class="tile" style="background:#0A0B14">
      <div class="blogo" style="background:linear-gradient(135deg,#9585FF,#6E5BFF)"><span class="b" style="color:#fff">B</span><span class="dot" style="background:#10F2A5"></span></div>
    </div>
    <div class="name">Full color</div><div class="use">Primary. Always prefer this.</div>
  </div>
  <div class="col">
    <div class="tile" style="background:#14152A">
      <div class="blogo" style="background:#fff"><span class="b" style="color:#14152A">B</span><span class="dot" style="background:#14152A"></span></div>
    </div>
    <div class="name">Reversed / white</div><div class="use">One-color on dark, when gradient can't render.</div>
  </div>
  <div class="col">
    <div class="tile" style="background:#F5F6FE">
      <div class="blogo" style="background:#1A1B2E"><span class="b" style="color:#fff">B</span><span class="dot" style="background:#fff"></span></div>
    </div>
    <div class="name">Mono / black</div><div class="use">Single-color print on light.</div>
  </div>
  <div class="col">
    <div class="tile" style="background:#0A0B14;color:#fff">
      <div class="blogo" style="border:2.5px solid currentColor"><span class="b" style="color:currentColor">B</span><span class="dot" style="border:2.5px solid currentColor;box-sizing:border-box"></span></div>
    </div>
    <div class="name">Line / outline</div><div class="use">Watermark / emboss. Keeps the dot as a ring.</div>
  </div>
</body></html>
