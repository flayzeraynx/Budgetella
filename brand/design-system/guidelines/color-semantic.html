<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Income mint & expense coral carry meaning — never decoration" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);color:var(--text-primary);padding:20px;display:flex;gap:16px}
  .sw{flex:1;border-radius:var(--radius-medium);border:var(--glass-border);overflow:hidden}
  .chip{height:64px}
  .meta{padding:10px 12px;background:var(--surface)}
  .n{font-size:13px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:12px;color:var(--text-tertiary);margin-top:2px}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:#10F2A5"></div><div class="meta"><div class="n">Income</div><div class="h">#10F2A5</div></div></div>
  <div class="sw"><div class="chip" style="background:#FB7185"></div><div class="meta"><div class="n">Expense</div><div class="h">#FB7185</div></div></div>
  <div class="sw"><div class="chip" style="background:#F59E0B"></div><div class="meta"><div class="n">Warning</div><div class="h">#F59E0B</div></div></div>
  <div class="sw"><div class="chip" style="background:#06B6D4"></div><div class="meta"><div class="n">Info</div><div class="h">#06B6D4</div></div></div>
</body></html>
