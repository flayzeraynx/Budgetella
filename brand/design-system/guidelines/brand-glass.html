<!-- @dsCard group="Brand" viewport="700x210" name="Glass card anatomy" subtitle="Translucent fill + 1px subtle border, blurred backdrop" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-brand);color:var(--text-primary);padding:24px;
    background:radial-gradient(120% 100% at 0% 0%, #1A1740 0%, #0A0B14 55%);display:flex;gap:24px;align-items:center}
  .card{flex:1;background:var(--glass-fill);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
    border:var(--glass-border);border-radius:var(--radius-medium);padding:var(--space-lg);box-shadow:var(--shadow-sm)}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-tertiary)}
  .amt{font-family:var(--font-mono);font-size:28px;font-weight:700;margin-top:6px}
  .specs{flex:1;font-size:13px;color:var(--text-secondary);line-height:1.9}
  .specs b{color:var(--text-primary);font-weight:600}
</style></head>
<body>
  <div class="card"><div class="eyebrow">Active month · May</div><div class="amt bdg-tabular">₺245.847</div></div>
  <div class="specs">
    <div><b>Fill</b> — .ultraThinMaterial → blur(24px)</div>
    <div><b>Border</b> — 1px white 8% (subtle)</div>
    <div><b>Radius</b> — 16 (medium)</div>
    <div><b>Shadow</b> — soft, low-contrast</div>
  </div>
</body></html>
