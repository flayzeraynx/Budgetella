<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);padding:24px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:baseline;gap:14px}
  .lbl{font-size:18px;font-weight:600;flex:1}
  .h{font-family:var(--font-mono);font-size:12px;color:var(--text-tertiary)}
</style></head>
<body>
  <div class="row"><span class="lbl" style="color:var(--text-primary)">Primary — headings & amounts</span><span class="h">#FFFFFF</span></div>
  <div class="row"><span class="lbl" style="color:var(--text-secondary)">Secondary — body & labels</span><span class="h">white 72%</span></div>
  <div class="row"><span class="lbl" style="color:var(--text-tertiary)">Tertiary — meta & captions</span><span class="h">white 50%</span></div>
</body></html>
