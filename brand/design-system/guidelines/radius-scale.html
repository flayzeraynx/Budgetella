<!-- @dsCard group="Spacing" viewport="700x180" name="Radius scale" subtitle="8 · 14 · 16 · 24 · 28 · full" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-brand);color:var(--text-primary);padding:24px;display:flex;gap:18px;align-items:flex-start}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
  .box{width:100%;height:72px;background:var(--surface-elevated);border:var(--glass-border)}
  .n{font-size:12px;font-weight:600}
  .h{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
</style></head>
<body>
  <div class="col"><div class="box" style="border-radius:8px"></div><div class="n">small</div><div class="h">8</div></div>
  <div class="col"><div class="box" style="border-radius:14px"></div><div class="n">row</div><div class="h">14</div></div>
  <div class="col"><div class="box" style="border-radius:16px"></div><div class="n">medium</div><div class="h">16</div></div>
  <div class="col"><div class="box" style="border-radius:24px"></div><div class="n">large</div><div class="h">24</div></div>
  <div class="col"><div class="box" style="border-radius:28px"></div><div class="n">sheet</div><div class="h">28</div></div>
  <div class="col"><div class="box" style="border-radius:999px"></div><div class="n">full</div><div class="h">999</div></div>
</body></html>
