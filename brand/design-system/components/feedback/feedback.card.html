<!-- @dsCard group="Components" viewport="700x560" name="Feedback & sheets" subtitle="BudgiInsight · Toast · EmptyState · Shimmer · PriceCard · BottomSheet" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;background:radial-gradient(120% 90% at 0% 0%, #1A1740 0%, #0A0B14 55%);
    font-family:var(--font-brand);color:var(--text-primary);padding:24px}
  .grid{display:flex;flex-direction:column;gap:20px;max-width:640px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:10px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
</style></head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { BudgiInsight, Toast, EmptyState, Shimmer, PriceCard, BottomSheet, Button, GlassCard } = window.BudgetellaDesignSystem_962d64;
    function Section({label, children}){ return (<div><div className="lbl">{label}</div>{children}</div>); }
    function Demo(){
      const [open,setOpen]=React.useState(false);
      return (<div className="grid">
        <Section label="Budgi AI insight">
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <BudgiInsight tag="SAVINGS" tone="income">You saved ₺10.011 from ₺245.847 income this month.</BudgiInsight>
            <BudgiInsight tag="BIGGEST TRANSACTION" tone="accent">Biggest expense this month: "Garanti kredi karti" — ₺73.000.</BudgiInsight>
          </div>
        </Section>
        <Section label="Toasts">
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <Toast tone="income">Transaction saved.</Toast>
            <Toast tone="expense">Couldn't save. Check your connection and try again.</Toast>
            <Toast tone="warning">You're nearing your Groceries limit — 340₺ left this month.</Toast>
          </div>
        </Section>
        <Section label="Price cards">
          <div className="row">
            <div style={{flex:1}}><PriceCard plan="Yearly" price="$39.99" period="/year" note="7-day free trial" ribbon="BEST VALUE" highlighted /></div>
            <div style={{flex:1}}><PriceCard plan="Monthly" price="$4.99" period="/month" /></div>
          </div>
        </Section>
        <Section label="Shimmer (skeleton)">
          <GlassCard>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <Shimmer width="50%" height={18} />
              <Shimmer height={14} /><Shimmer width="80%" height={14} />
            </div>
          </GlassCard>
        </Section>
        <Section label="Empty state · Bottom sheet">
          <div style={{position:'relative',border:'var(--glass-border)',borderRadius:'var(--radius-large)',overflow:'hidden',height:280,background:'var(--bg)'}}>
            <EmptyState icon="receipt" title="No transactions yet"
              message="Add your first — camera, voice, or by hand."
              action={<Button onClick={()=>setOpen(true)}>Add expense</Button>} />
            <BottomSheet open={open} title="Add expense" onClose={()=>setOpen(false)}>
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                <Toast tone="info">Budgi will suggest a category — you confirm.</Toast>
                <Button full onClick={()=>setOpen(false)}>Save</Button>
              </div>
            </BottomSheet>
          </div>
        </Section>
      </div>);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
    setTimeout(()=>window.lucide&&lucide.createIcons(),200);
  </script>
</body></html>
